name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "scripts/validate-skills.js"
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate SKILL.md frontmatter
        run: node scripts/validate-skills.js